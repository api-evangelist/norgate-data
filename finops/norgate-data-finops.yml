meters:
- name: market_subscription
  description: Flat subscription per market and history-depth tier (Silver/Gold/Platinum/Diamond, Futures, Forex).
  unit: subscription
  aggregation: sum
  dimensions:
  - market
  - tier
  - term
- name: local_compute
  description: Cost of the subscriber-owned Windows machine or VM required to run the Norgate Data Updater (no Norgate invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - machine
principles:
- name: Visibility
  description: Track which market packages and history tiers are subscribed; there is no per-query spend to monitor since access is local.
- name: Allocation
  description: Map each market/tier subscription to the strategy or team that requires it.
- name: Optimization
  description: Subscribe only to needed markets and history depth; prefer 12-month terms for the discount; consolidate onto a shared NDU VM where licensing permits.
- name: Accountability
  description: Assign an owner to renew subscriptions on schedule and review whether each market/tier is still used before renewal.
