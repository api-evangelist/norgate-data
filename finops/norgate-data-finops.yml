description: >-
  FinOps view of Norgate Data spend. Cost is a flat, predictable data
  subscription rather than usage-metered API charges - there are no per-request,
  per-token or per-GB fees because access is a local library over the on-machine
  NDU database. Spend is driven by which markets you subscribe to (US, Australian,
  Canadian stocks, Futures, Forex), the history-depth tier chosen per stock market
  (Silver 10y, Gold 20y, Platinum to early 1990s, Diamond to 1950 for US), the
  subscription term (6 or 12 months, with a ~10 percent discount on annual), and
  any add-ons (US OTC securities, ASX derivatives). Secondary cost is the
  subscriber-owned Windows machine or VM required to run NDU. Because billing is a
  fixed recurring subscription, cost is fully predictable and easy to allocate.
notes: >-
  No consumption meters apply - this is a flat subscription. Optimize by
  subscribing only to the markets and history depth actually needed for your
  strategies and by choosing annual terms for the discount. Verify current per-
  market prices and currencies on the Norgate price calculator.
