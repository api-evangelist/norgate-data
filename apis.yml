name: Norgate Data
kind: company
description: >-
  Norgate Data provides high-quality, survivorship-bias-free end-of-day (EOD)
  historical market data for US, Australian and Canadian stocks, around 100
  worldwide futures markets, and foreign exchange. Data is not delivered as a
  hosted REST API. Instead, subscribers install the Norgate Data Updater (NDU),
  a Windows desktop application that downloads and maintains a complete local
  database and runs a local data service. Programmatic access is through the
  norgatedata Python package (on PyPI), which talks to that local NDU service
  and returns price/volume history, corporate actions, index constituent
  history, security metadata, fundamentals, and watchlists as Pandas DataFrames
  or NumPy arrays. Norgate also ships plugins for platforms such as Amibroker and
  is widely used with Python backtesting frameworks (Zipline, Backtrader). This
  entry honestly models the norgatedata library's logical operations as
  capability areas; it is a client library over a local service, not a public
  HTTP/REST API.
