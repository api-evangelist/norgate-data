    description: >-
      Retrieve daily EOD open/high/low/close, volume, turnover, unadjusted close,
      dividends and open interest as a Pandas DataFrame or NumPy array. Supports
      date ranges, record limits, weekly/monthly/quarterly/yearly intervals,
      capital-and-dividend price adjustment (total return, capital, capital+special,
      none) and date padding. Delivered by the norgatedata Python package reading
      from the local NDU database - there is no public HTTP endpoint.
